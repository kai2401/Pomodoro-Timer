<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="timer-card">
      <h1>Pomodoro Timer</h1>

      <section class="timer" aria-label="Timer">
        <p class="phase-label" id="phase-label">Work</p>
        <div
          class="progress"
          id="timer-progress"
          role="progressbar"
          aria-label="Timer progress"
          aria-valuemin="0"
          aria-valuemax="1500"
          aria-valuenow="1500"
        >
          <svg class="progress-ring" viewBox="0 0 250 250" aria-hidden="true">
            <circle class="progress-ring-background" cx="125" cy="125" r="115"></circle>
            <circle
              class="progress-ring-foreground"
              id="progress-ring"
              cx="125"
              cy="125"
              r="115"
              transform="rotate(-90 125 125)"
            ></circle>
          </svg>
          <span class="time-display" id="time-display">25:00</span>
        </div>
      </section>

      <div class="controls" role="group" aria-label="Timer controls">
        <button class="button button-primary" id="start-button" type="button">Start</button>
        <button class="button" id="pause-button" type="button">Pause</button>
        <button class="button" id="reset-button" type="button">Reset</button>
      </div>

      <p class="session-count">
        Completed work sessions: <span id="session-count">0</span>
      </p>
    </main>
  </body>
</html>
